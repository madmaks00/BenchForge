name: macOS verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/macos.yml']
permissions:
  contents: read
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      BENCHFORGE_TOOLCHAIN_HOME: ${{ github.workspace }}/.toolchains
      BENCHFORGE_WORKERS: ${{ github.workspace }}/workers
      DBLAB_REPORTS: ${{ github.workspace }}/macos-reports
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-go@v5
        with:
          go-version-file: workers/go/go.mod
          cache: false
      - name: Install Rust
        run: rustup update stable --no-self-update
      - name: Build and test .NET
        run: |
          dotnet restore BenchForge.slnx --locked-mode
          dotnet build BenchForge.slnx -c Release --no-restore
          dotnet test tests/BenchForge.Tests/BenchForge.Tests.csproj -c Release --no-build --logger trx
      - name: Prepare native engines
        run: bash workers/prepare.sh java,python,rust,node,go
      - name: Verify worker protocol
        run: dotnet src/BenchForge.Cli/bin/Release/net10.0/BenchForge.Cli.dll --verify-workers --languages csharp,java,python,rust,node,go
      - name: Run real SQLite workloads on every engine
        run: dotnet src/BenchForge.Cli/bin/Release/net10.0/BenchForge.Cli.dll --config configs/multi-engine-smoke.json --reports macos-reports/sqlite
      - name: Run custom SQL workload
        run: dotnet src/BenchForge.Cli/bin/Release/net10.0/BenchForge.Cli.dll --config configs/custom-sql-smoke.json --workload configs/workloads/store.json --reports macos-reports/custom
      - name: Open real Avalonia window and verify UI
        run: dotnet src/BenchForge.Desktop/bin/Release/net10.0/BenchForge.Desktop.dll --ui-smoke
      - name: Verify workload editor and report UI
        run: dotnet src/BenchForge.Desktop/bin/Release/net10.0/BenchForge.Desktop.dll --ui-workload-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-validation-${{ matrix.os }}
          path: |
            macos-reports
            tests/BenchForge.Tests/TestResults
